[package]
name = "wokwi-test"
version = "0.1.0"
edition = "2021"

[features]
# Off by default. When enabled, the firmware ships a DCF77 loopback
# transmitter on `bsp::Dcf77OutPin` that re-broadcasts the current
# `ClockState` as a real DCF77 pulse stream. Useful for driving the
# firmware's own receiver inside the Wokwi simulator; harmless but
# wasteful on real hardware (drives a GPIO nobody listens to).
dcf77-loopback = []

[dependencies]
# The library (`src/lib.rs`) is pure Rust with no external deps so it can be
# `cargo test`-ed on the host. All embedded-only crates that only the
# firmware binary needs live in the target-gated section below.

# Host-only deps used by examples/tools (e.g. `examples/render_fixture.rs`
# which writes PNGs for the decoder round-trip in `check.sh`). Dev-deps are
# never linked into the firmware binary, so these don't affect flash size.
[dev-dependencies]
png = "0.17"

# Firmware-only deps. These are skipped when targeting the host
# (e.g. `cargo test --lib --target=<host-triple>`), so the pure-logic lib
# can be host-tested without dragging in `rp2040-pac` etc.
[target.thumbv6m-none-eabi.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
rp-pico = { version = "0.9", features = ["boot2"] }
embedded-hal = "0.2"
cortex-m-rtic = "1.1"
max7219 = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
